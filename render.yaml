# Blueprint do Render. No painel: New > Blueprint > aponte para este repositório.
services:
  - type: web
    name: osint-detetive
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/saude
    envVars:
      - key: DATABASE_URL              # cole a connection string do Neon
        sync: false
      - key: ADMIN_NOME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_SENHA
        sync: false
      - key: DATAJUD_API_KEY
        sync: false
      - key: PORTAL_TRANSPARENCIA_KEY
        sync: false
      - key: SESSION_TTL_HORAS
        value: "12"
      - key: COOKIE_SEGURO
        value: "1"
      - key: FERRAMENTAS_LOCAIS
        value: "1"
      - key: MAIGRET_TOP_SITES
        value: "50"
      - key: MAIGRET_TIMEOUT
        value: "15"
      - key: CORS_ORIGINS
        value: ""
